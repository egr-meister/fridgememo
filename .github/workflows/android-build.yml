name: Android Build (APK + AAB)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 35 and Build Tools 35.0.0
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install dependencies
        run: npm install

      - name: Prepare Android project (Expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Copy ProGuard rules
        run: cp proguard-rules.pro android/app/proguard-rules.pro

      - name: Decode keystore and configure signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No keystore secret found. The release build will use the debug keystore."
            echo "Add ANDROID_KEYSTORE_BASE64 and related secrets for a Play-ready signed build."
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          fi
          node scripts/configure-android-signing.js

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Rename artifacts
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} build-output/fridgememo-release.apk \;
          find android/app/build/outputs/bundle/release -name "*.aab" -exec cp {} build-output/fridgememo-release.aab \;
          ls -la build-output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fridgememo-release-apk
          path: build-output/fridgememo-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: fridgememo-release-aab
          path: build-output/fridgememo-release.aab
          if-no-files-found: error
